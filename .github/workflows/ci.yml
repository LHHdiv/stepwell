name: CI

# push 时验证构建是否通过，防止坏内容上线
# 部署走 Netlify 的 Git 集成（推送 main 即自动构建发布），
# 因此这里只做构建校验，不再往 gh-pages 发布（原兜底通道已移除）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建验证
        run: npm run build
